<!DOCTYPE html>
<html>
<head>
    <title>XML Student Records</title>
</head>

<body>

    <h1>Student Records</h1>

    <button onclick="loadStudents()">Load Students</button>

    <div id="output"></div>

    <script>
        function loadStudents() {

            fetch("students.xml")
            .then(response => response.text())
            .then(data => {

                let parser = new DOMParser();
                let xml = parser.parseFromString(data, "text/xml");

                let students = xml.getElementsByTagName("student");

                let result = "<h2>Student Information</h2>";

                for (let i = 0; i < students.length; i++) {

                    let id = students[i].getElementsByTagName("id")[0].textContent;
                    let name = students[i].getElementsByTagName("name")[0].textContent;
                    let course = students[i].getElementsByTagName("course")[0].textContent;
                    let marks = students[i].getElementsByTagName("marks")[0].textContent;

                    result += "<p>";
                    result += "ID: " + id + "<br>";
                    result += "Name: " + name + "<br>";
                    result += "Course: " + course + "<br>";
                    result += "Marks: " + marks;
                    result += "</p><hr>";
                }

                document.getElementById("output").innerHTML = result;

            });
        }
    </script>

</body>
</html>
